    <script>
      // GitHub Pages SPA-Trick: stellt den ursprünglichen Pfad wieder her,
      // nachdem 404.html ihn als Query-String hierher umgeleitet hat.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <script>
      // Normalisiert einen abschließenden Schrägstrich weg (z.B. von
      // /leistungen/ zu /leistungen), damit react-router die Route
      // zuverlässig matcht – Server können beim Aufruf von Verzeichnissen
      // automatisch einen Schrägstrich anhängen.
      if (location.pathname.length > 1 && location.pathname.endsWith('/')) {
        window.history.replaceState(
          null,
          null,
          location.pathname.slice(0, -1) + location.search + location.hash
        )
      }
    </script>
